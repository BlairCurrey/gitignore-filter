name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deep run of the randomized comparison against git, with a new seed each time.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      # Build once with a current Node, then run the tests on the matrix version.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test (compares every answer against git)
        run: npm run test:only
        env:
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '5000' || '300' }}
          FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || '20261004' }}
